# DR runtime for lab-node18 on the AWS EC2 host (ap-southeast-7).
# Generic upstream image, no Dockerfile, no image build.
# Code is bind-mounted read-only from the host; the pipeline swaps the
# /opt/apps/lab-node18/current symlink to a new release on every deploy.
name: lab-node18

services:
  lab-node18:
    image: node:18
    container_name: lab-node18
    restart: unless-stopped
    working_dir: /app
    # Non-secret config, deployed by the pipeline from dr/config.env
    env_file: /opt/dr/lab-node18/config.env
    environment:
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3001:3000"
    volumes:
      - /opt/apps/lab-node18/current:/src:ro
    # Secrets are files on the host (root:root 600), mounted at
    # /run/secrets/<TARGET>. Not visible in `docker inspect`.
    secrets:
      - source: db_password
        target: DB_PASSWORD
      - source: api_key
        target: API_KEY
    # 1) export every /run/secrets/<NAME> as env var NAME (no code change)
    # 2) copy code into the container layer so node_modules never lands on the host
    # 3) install prod deps and start
    command:
      - sh
      - -c
      - |
        set -e
        for f in /run/secrets/*; do [ -f "$$f" ] && export "$$(basename "$$f")=$$(cat "$$f")"; done
        cp -a /src/. /app/
        npm ci --omit=dev --no-audit --no-fund
        exec node index.js
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

secrets:
  db_password:
    file: /opt/dr-secrets/lab-node18/DB_PASSWORD
  api_key:
    file: /opt/dr-secrets/lab-node18/API_KEY
